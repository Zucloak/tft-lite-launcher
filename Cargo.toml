[package]
name = "tft-lite-launcher"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform native Rust launcher for Teamfight Tactics Mobile via Android Command Line Tools"
repository = "https://github.com/tft-lite-launcher/tft-lite-launcher"

[dependencies]
active-win-pos-rs = "0.9"
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
enigo = "0.2"
flate2 = "1.0"
rdev = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.32"
tar = "0.4"
thiserror = "2.0"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
